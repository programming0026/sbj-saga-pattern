spring.application.name=sbj-saga-pattern
server.port=8080

# Kafka (docker compose up -d)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Un grupo nuevo empieza por el principio: asi no se pierden mensajes publicados antes de que el listener se asigne
spring.kafka.consumer.auto-offset-reset=earliest

# Base de datos en memoria (cada "servicio" tiene sus propias tablas)
spring.sql.init.mode=always

# Orquestador: cuanto espera la respuesta de un paso antes de compensar, cada cuanto revisa y cuantos reintentos de compensacion
saga.step-timeout-ms=15000
saga.watch-interval-ms=1000
saga.max-compensation-attempts=5
